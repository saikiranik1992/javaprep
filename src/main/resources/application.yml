server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring:
  application:
    name: zero-to-hero-interview-guide
  thymeleaf:
    cache: ${SPRING_THYMELEAF_CACHE:false}
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html
  web:
    resources:
      static-locations: classpath:/static/
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

razorpay:
  key-id: ${RAZORPAY_KEY_ID:test_key_sample}
  key-secret: ${RAZORPAY_KEY_SECRET:test_secret_sample}
  mock-enabled: ${RAZORPAY_MOCK_ENABLED:true}

pricing:
  topic-rupees: 49
  bundle-rupees: 499

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
