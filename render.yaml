services:
  - type: web
    name: architect-zero-to-hero-thymeleaf-portal
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_THYMELEAF_CACHE
        value: true
      - key: IDE_EXECUTION_TIMEOUT_SECONDS
        value: 20
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseSerialGC -XX:MaxRAMPercentage=70.0 -XX:TieredStopAtLevel=1"
