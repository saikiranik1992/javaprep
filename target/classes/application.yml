server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring:
  application:
    name: zero-to-hero-interview-guide
  thymeleaf:
    cache: ${SPRING_THYMELEAF_CACHE:false}
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html
  web:
    resources:
      static-locations: classpath:/static/
  datasource:
    # Render PostgreSQL Database Connection
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://dpg-dbiaam67bikc73ajhe80-a.singapore-postgres.render.com:5432/javaprep?sslmode=require}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:javaprep_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:2ZytgjY0mCr1dNJzEmSildzD33mZ7Ij5}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
